name: self-repair-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: '1.27.x'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify formatting
        run: |
          formatted=$(gofmt -l cmd generated internal)
          if [ -n "$formatted" ]; then
            printf '%s\n' "$formatted"
            gofmt -d $formatted
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/self-repair-test.time" \
            go test -json -count=1 ./... > "$RUNNER_TEMP/self-repair-go-test.json"
      - name: Build generated evaluator runner
        run: |
          /usr/bin/time -f '%e %M' -o "$RUNNER_TEMP/self-repair-build.time" \
            go build -trimpath -o "$RUNNER_TEMP/self-repair" ./cmd/self-repair
      - name: Run conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/conformance.sh \
            "$RUNNER_TEMP/self-repair" \
            "$RUNNER_TEMP/self-repair-artifacts" \
            "$GITHUB_SHA" \
            "$GO_VERSION" \
            "$RUNNER_TEMP/self-repair-go-test.json" \
            "$RUNNER_TEMP/self-repair-test.time" \
            "$RUNNER_TEMP/self-repair-build.time"
      - name: Upload exact generated artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v5
        with:
          name: self-repair-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/self-repair-artifacts
          if-no-files-found: error
          include-hidden-files: false
      - name: Publish artifact receipt
        run: |
          echo "artifact_id=${{ steps.upload-artifacts.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_digest=${{ steps.upload-artifacts.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
