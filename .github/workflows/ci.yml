name: self-repair-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GO_VERSION: '1.27.x'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify formatting
        run: |
          formatted=$(gofmt -l cmd generated internal)
          if [ -n "$formatted" ]; then
            printf '%s\n' "$formatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build generated evaluator runner
        run: go build -trimpath -o "$RUNNER_TEMP/self-repair" ./cmd/self-repair
      - name: Run conformance
        run: |
          bash scripts/conformance.sh "$RUNNER_TEMP/self-repair" "$RUNNER_TEMP/self-repair-artifacts" "$GITHUB_SHA" "$GO_VERSION"
      - name: Upload exact generated artifacts
        id: upload-artifacts
        uses: actions/upload-artifact@v5
        with:
          name: self-repair-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/self-repair-artifacts
          if-no-files-found: error
          include-hidden-files: false
      - name: Publish artifact receipt
        run: |
          echo "artifact_id=${{ steps.upload-artifacts.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_digest=${{ steps.upload-artifacts.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
