name: immutable-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify annotated tag
        run: |
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_object=$(git rev-parse "refs/tags/$GITHUB_REF_NAME")
          test "$(git cat-file -t "$tag_object")" = tag
          test "$(git rev-list -n 1 "$tag_object^{commit}")" = "$GITHUB_SHA"
      - name: Build source archive and checksums
        run: |
          git archive --format=tar.gz --prefix="gooo-self-repair-example-${GITHUB_REF_NAME#v}/" -o "gooo-self-repair-example-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_SHA"
          sha256sum "gooo-self-repair-example-${GITHUB_REF_NAME#v}.tar.gz" > SHA256SUMS
          printf '{"schema":"gooo.self-repair.release-manifest.v1","tag":"%s","commit":"%s","immutable":true}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > release-manifest.json
          test "$(jq -r '.tag' release-manifest.json)" = "$GITHUB_REF_NAME"
          test "$(jq -r '.commit' release-manifest.json)" = "$GITHUB_SHA"
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "gooo-self-repair-example-${GITHUB_REF_NAME#v}.tar.gz" \
            SHA256SUMS release-manifest.json \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "Immutable self-repair execution source release."
      - name: Verify immutable release API receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")
          test "$(jq -r '.tag_name' <<<"$release")" = "$GITHUB_REF_NAME"
          test "$(jq -r '.immutable' <<<"$release")" = true
          for asset in "gooo-self-repair-example-${GITHUB_REF_NAME#v}.tar.gz" SHA256SUMS release-manifest.json; do
            expected="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            actual=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest' <<<"$release")
            test "$actual" = "$expected"
          done
