name: immutable-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify annotated tag
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME^{tag}")" = tag
          test "$(git rev-parse "$GITHUB_REF_NAME^{}")" = "$GITHUB_SHA"
      - name: Build source archive and checksums
        run: |
          git archive --format=tar.gz --prefix="gooo-self-repair-example-${GITHUB_REF_NAME#v}/" -o "gooo-self-repair-example-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_SHA"
          sha256sum "gooo-self-repair-example-${GITHUB_REF_NAME#v}.tar.gz" > SHA256SUMS
          printf '{"schema":"gooo.self-repair.release-manifest.v1","tag":"%s","commit":"%s","immutable":true}\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > release-manifest.json
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "gooo-self-repair-example-${GITHUB_REF_NAME#v}.tar.gz" \
            SHA256SUMS release-manifest.json \
            --verify-tag --title "$GITHUB_REF_NAME" --notes "Immutable self-repair execution source release."
